---
apiVersion: v1
kind: Service
metadata:
  name: redirect-dummy
  namespace: external
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dabitches-redirect
  namespace: external
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/permanent-redirect: https://koornbeurs.nl
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dabitches.com
        - www.dabitches.com
      secretName: dabitches-tls
  rules:
    - host: dabitches.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-dummy
                port:
                  number: 80
    - host: www.dabitches.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-dummy
                port:
                  number: 80
