---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dabitches-redirect
  namespace: external
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-dabitches
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-www-dabitches
  hostnames:
    - dabitches.com
    - www.dabitches.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: koornbeurs.nl
            statusCode: 301
