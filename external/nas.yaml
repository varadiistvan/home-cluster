---
apiVersion: v1
kind: Service
metadata:
  name: nas-external
  namespace: external
spec:
  ports:
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nas-external-1
  namespace: external
  labels:
    kubernetes.io/service-name: nas-external
addressType: IPv4
ports:
  - name: web
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 192.168.0.151
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas
  namespace: external
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-nas
  hostnames:
    - nas.stevevaradi.me
  rules:
    - backendRefs:
        - name: nas-external
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lan-only-nas
  namespace: external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nas
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 192.168.0.0/24
            - 10.192.1.0/24
