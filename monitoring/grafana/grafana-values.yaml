global:
  image:
    registry: docker.io
ingress:
  enabled: false
resources:
  requests:
    cpu: 15m
    memory: 208Mi
  limits:
    memory: 1Gi
persistence:
  type: pvc
  enabled: true
  storageClassName: nfs-csi
  accessModes:
  - ReadWriteOnce
  size: 8Gi
service:
  port: 3000
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
grafana.ini:
  server:
    domain: grafana.stevevaradi.me
    root_url: https://grafana.stevevaradi.me/
  paths:
    data: /var/lib/grafana/data
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: true
  feature_toggles:
    enable: ngalert
  log:
    mode: console
  grafana_net:
    url: https://grafana.net
  smtp:
    enabled: false
    host: smtp.postmarkapp.com:587
    from_address: grafana@stevevaradi.me
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus (provisioned)
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://misty-show-kube-prometheus-prometheus.monitoring.svc:9090
      isDefault: false
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: home-cluster
      orgId: 1
      folder: Home Cluster
      type: file
      disableDeletion: true
      editable: true
      options:
        path: /var/lib/grafana/dashboards/home-cluster
dashboards:
  home-cluster:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource:
      - name: DS_PROMETHEUS
        value: prometheus
    k8s-global:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
    k8s-namespaces:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
    k8s-nodes:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
    k8s-pods:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
    power:
      json: |
        {
          "title": "Power Usage",
          "uid": "home-power",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": {"from": "now-24h", "to": "now"},
          "panels": [
            {
              "type": "stat",
              "title": "Current draw",
              "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "watt", "decimals": 1}},
              "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area"},
              "targets": [{"expr": "sum by (node) (scaphandre_host_power_microwatts) / 1e6", "legendFormat": "{{node}}"}]
            },
            {
              "type": "timeseries",
              "title": "Power over time",
              "gridPos": {"h": 10, "w": 24, "x": 0, "y": 6},
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "watt", "custom": {"fillOpacity": 15, "stacking": {"mode": "normal"}}}},
              "targets": [{"expr": "sum by (node) (scaphandre_host_power_microwatts) / 1e6", "legendFormat": "{{node}}"}]
            },
            {
              "type": "stat",
              "title": "Energy (last 24h)",
              "gridPos": {"h": 6, "w": 24, "x": 0, "y": 16},
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {"defaults": {"unit": "kwatth", "decimals": 2}},
              "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
              "targets": [{"expr": "sum by (node) (avg_over_time(scaphandre_host_power_microwatts[24h])) / 1e6 * 24 / 1000", "legendFormat": "{{node}}"}]
            }
          ]
        }
namespaceOverride: monitoring
imageRenderer:
  enabled: false
  resources:
    limits:
      cpu: 100m
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 64Mi
