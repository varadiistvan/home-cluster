---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pi5-monitor
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pi5-monitor
      # renovate: datasource=docker depName=harbor.stevevaradi.me/stevevaradi/pi5-monitor
      version: 0.1.5
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: pi5-monitor-values
