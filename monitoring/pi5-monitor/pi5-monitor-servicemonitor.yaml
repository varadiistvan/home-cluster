apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pi5-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pi5-monitor
      app.kubernetes.io/instance: pi5-monitor
  endpoints:
    - port: http
      interval: 30s
      metricRelabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
