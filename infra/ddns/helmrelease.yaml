---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ddns
  namespace: network
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kubernetes-cloudflare-ddns
      # renovate: datasource=helm depName=kubernetes-cloudflare-ddns registryUrl=https://charts.kubito.dev
      version: 1.0.6
      sourceRef:
        kind: HelmRepository
        name: kubito
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: ddns-values
