apiVersion: v1
kind: ServiceAccount
metadata:
  name: iscsi-eio-remediator
  namespace: storage
  labels:
    app.kubernetes.io/name: iscsi-eio-remediator
    app.kubernetes.io/instance: iscsi-provisioner
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: iscsi-eio-remediator
  labels:
    app.kubernetes.io/name: iscsi-eio-remediator
    app.kubernetes.io/instance: iscsi-provisioner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: iscsi-eio-remediator
  labels:
    app.kubernetes.io/name: iscsi-eio-remediator
    app.kubernetes.io/instance: iscsi-provisioner
subjects:
  - kind: ServiceAccount
    name: iscsi-eio-remediator
    namespace: storage
roleRef:
  kind: ClusterRole
  name: iscsi-eio-remediator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iscsi-eio-remediator
  namespace: storage
  labels:
    app.kubernetes.io/name: iscsi-eio-remediator
    app.kubernetes.io/instance: iscsi-provisioner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iscsi-eio-remediator
      app.kubernetes.io/instance: iscsi-provisioner
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: iscsi-eio-remediator
      labels:
        app.kubernetes.io/name: iscsi-eio-remediator
        app.kubernetes.io/instance: iscsi-provisioner
    spec:
      serviceAccountName: iscsi-eio-remediator
      tolerations:
        - key: iscsi.stevevaradi.me/eio
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: registry-pass
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: remediator
          # renovate: datasource=docker depName=harbor.stevevaradi.me/stevevaradi/iscsi-eio-remediator
          image: harbor.stevevaradi.me/stevevaradi/iscsi-eio-remediator:v0.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/remediate-iscsi-eio.sh
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: ENABLE_ANNOTATION
              value: iscsi.stevevaradi.me/eio-remediate
            - name: REMEDIATE_UNANNOTATED
              value: "false"
            - name: CSI_DRIVER_NAME
              value: iscsi.stevevaradi.me
            - name: SCAN_INTERVAL_SECONDS
              value: "30"
            - name: PROBE_TIMEOUT_SECONDS
              value: "5"
            - name: KUBECTL_TIMEOUT_SECONDS
              value: 10s
            - name: DELETE_COOLDOWN_SECONDS
              value: "300"
            - name: TAINT_NODE_ON_EIO
              value: "true"
            - name: NODE_EIO_TAINT
              value: iscsi.stevevaradi.me/eio=true:NoSchedule
            - name: CLEAR_TAINT_AFTER_CLEAN_SECONDS
              value: "120"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /scripts/check-heartbeat.sh
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - /scripts/check-heartbeat.sh
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: kubelet-dir
              mountPath: /host/var/lib/kubelet
              readOnly: true
              mountPropagation: HostToContainer
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: scripts
          configMap:
            name: iscsi-eio-remediator
            defaultMode: 0755
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iscsi-eio-remediator
  namespace: storage
  labels:
    app.kubernetes.io/name: iscsi-eio-remediator
    app.kubernetes.io/instance: iscsi-provisioner
data:
  check-heartbeat.sh: |
    #!/bin/sh
    set -eu

    MAX_AGE_SECONDS="${HEARTBEAT_MAX_AGE_SECONDS:-180}"

    beat="$(cat /state/heartbeat 2>/dev/null || true)"
    case "$beat" in
      ''|*[!0-9]*)
        echo "heartbeat file missing or not a timestamp" >&2
        exit 1
        ;;
    esac

    age=$(( $(date +%s) - beat ))
    if [ "$age" -ge "$MAX_AGE_SECONDS" ]; then
      echo "heartbeat is ${age}s old (max ${MAX_AGE_SECONDS}s)" >&2
      exit 1
    fi
  remediate-iscsi-eio.sh: |
    #!/bin/sh
    set -eu

    : "${NODE_NAME:?NODE_NAME is required}"
    ENABLE_ANNOTATION="${ENABLE_ANNOTATION:-iscsi.stevevaradi.me/eio-remediate}"
    REMEDIATE_UNANNOTATED="${REMEDIATE_UNANNOTATED:-false}"
    CSI_DRIVER_NAME="${CSI_DRIVER_NAME:-iscsi.stevevaradi.me}"
    SCAN_INTERVAL_SECONDS="${SCAN_INTERVAL_SECONDS:-30}"
    PROBE_TIMEOUT_SECONDS="${PROBE_TIMEOUT_SECONDS:-5}"
    KUBECTL_TIMEOUT_SECONDS="${KUBECTL_TIMEOUT_SECONDS:-10s}"
    DELETE_COOLDOWN_SECONDS="${DELETE_COOLDOWN_SECONDS:-300}"
    TAINT_NODE_ON_EIO="${TAINT_NODE_ON_EIO:-true}"
    NODE_EIO_TAINT="${NODE_EIO_TAINT:-iscsi.stevevaradi.me/eio=true:NoSchedule}"
    CLEAR_TAINT_AFTER_CLEAN_SECONDS="${CLEAR_TAINT_AFTER_CLEAN_SECONDS:-120}"
    KUBELET_ROOT="/host/var/lib/kubelet"
    DELETE_STATE_DIR="/state/deleted"
    TERMINATING=0
    ACTIVE_CHILD=""

    log() {
      printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"
    }

    now_seconds() {
      date +%s
    }

    # Write via a temp file so probes never observe a truncated heartbeat.
    heartbeat() {
      now_seconds > /state/heartbeat.tmp && mv -f /state/heartbeat.tmp /state/heartbeat
    }

    kubectl_timed() {
      timeout "$KUBECTL_TIMEOUT_SECONDS" kubectl "$@"
    }

    request_stop() {
      TERMINATING=1
      log "received termination signal, stopping iSCSI EIO remediator"
      if [ -n "${ACTIVE_CHILD}" ]; then
        kill "${ACTIVE_CHILD}" 2>/dev/null || true
      fi
    }

    interruptible_sleep() {
      sleep "$SCAN_INTERVAL_SECONDS" &
      ACTIVE_CHILD="$!"
      wait "$ACTIVE_CHILD" 2>/dev/null || true
      ACTIVE_CHILD=""
    }

    trap request_stop TERM INT

    pod_info_for_uid() {
      pod_uid="$1"
      template='{{range .items}}{{if eq .metadata.uid "'$pod_uid'"}}{{.metadata.namespace}}{{"\t"}}{{.metadata.name}}{{"\t"}}{{with .metadata.annotations}}{{index . "'$ENABLE_ANNOTATION'"}}{{end}}{{"\n"}}{{end}}{{end}}'
      kubectl_timed get pods -A --field-selector "spec.nodeName=${NODE_NAME}" -o "go-template=${template}"
    }

    driver_name_for_mount() {
      mount_path="$1"
      metadata_file="${mount_path%/mount}/vol_data.json"

      [ -r "$metadata_file" ] || return 1
      sed -n 's/.*"driverName"[[:space:]]*:[[:space:]]*"\([^"\\]*\)".*/\1/p' "$metadata_file" | head -n 1
    }

    recently_deleted() {
      key="$1"
      state_file="${DELETE_STATE_DIR}/${key}"
      [ -f "$state_file" ] || return 1

      last="$(cat "$state_file" 2>/dev/null || echo 0)"
      now="$(now_seconds)"
      case "$last" in
        ''|*[!0-9]*) return 1 ;;
      esac
      [ $((now - last)) -lt "$DELETE_COOLDOWN_SECONDS" ]
    }

    remember_delete() {
      key="$1"
      now_seconds > "${DELETE_STATE_DIR}/${key}"
    }

    prune_delete_state() {
      now="$(now_seconds)"
      for state_file in "${DELETE_STATE_DIR}"/*; do
        [ -f "$state_file" ] || continue
        last="$(cat "$state_file" 2>/dev/null || echo 0)"
        case "$last" in
          ''|*[!0-9]*) rm -f "$state_file"; continue ;;
        esac
        if [ $((now - last)) -ge "$DELETE_COOLDOWN_SECONDS" ]; then
          rm -f "$state_file"
        fi
      done
    }

    taint_key() {
      printf '%s\n' "$NODE_EIO_TAINT" | sed 's/[=:].*//'
    }

    taint_remove_arg() {
      printf '%s-\n' "$(taint_key)"
    }

    node_is_quarantined() {
      [ "$TAINT_NODE_ON_EIO" = "true" ] || return 1

      key="$(taint_key)"
      found="$(kubectl_timed get node "$NODE_NAME" -o "jsonpath={.spec.taints[?(@.key=='$key')].key}" 2>/state/kubectl.err)" || return 2
      [ "$found" = "$key" ]
    }

    record_eio() {
      now_seconds > /state/last-eio
      rm -f /state/clean-since
    }

    quarantine_node() {
      [ "$TAINT_NODE_ON_EIO" = "true" ] || return 0

      record_eio
      log "tainting node ${NODE_NAME} with ${NODE_EIO_TAINT}: iSCSI mount returned EIO"
      kubectl_timed taint node "$NODE_NAME" "$NODE_EIO_TAINT" --overwrite >/dev/null 2>&1 || \
        log "failed to taint node ${NODE_NAME} with ${NODE_EIO_TAINT}"
    }

    clear_recovered_node() {
      [ "$TAINT_NODE_ON_EIO" = "true" ] || return 0
      [ "$CLEAR_TAINT_AFTER_CLEAN_SECONDS" -gt 0 ] || return 0

      if node_is_quarantined; then
        node_status=0
      else
        node_status=$?
      fi

      if [ "$node_status" -eq 2 ]; then
        log "could not check quarantine state for node ${NODE_NAME}; leaving recovery state unchanged"
        return 0
      fi

      if [ "$node_status" -ne 0 ]; then
        rm -f /state/clean-since /state/last-eio
        return 0
      fi

      now="$(now_seconds)"
      if [ -f /state/last-eio ]; then
        last_eio="$(cat /state/last-eio 2>/dev/null || echo "$now")"
        case "$last_eio" in
          ''|*[!0-9]*) last_eio="$now" ;;
        esac
        if [ $((now - last_eio)) -lt "$CLEAR_TAINT_AFTER_CLEAN_SECONDS" ]; then
          return 0
        fi
      fi

      if [ ! -f /state/clean-since ]; then
        printf '%s\n' "$now" > /state/clean-since
        log "node ${NODE_NAME} is quarantined but iSCSI probes are clean; starting recovery timer"
        return 0
      fi

      clean_since="$(cat /state/clean-since 2>/dev/null || echo "$now")"
      case "$clean_since" in
        ''|*[!0-9]*) clean_since="$now" ;;
      esac
      if [ $((now - clean_since)) -lt "$CLEAR_TAINT_AFTER_CLEAN_SECONDS" ]; then
        return 0
      fi

      log "removing ${NODE_EIO_TAINT} from node ${NODE_NAME}: iSCSI probes stayed clean for ${CLEAR_TAINT_AFTER_CLEAN_SECONDS}s"
      if kubectl_timed taint node "$NODE_NAME" "$(taint_remove_arg)" >/dev/null 2>&1; then
        rm -f /state/clean-since /state/last-eio
      else
        log "failed to remove ${NODE_EIO_TAINT} from node ${NODE_NAME}"
      fi
    }

    mount_options_for() {
      mount_path="$1"
      awk -v mp="$mount_path" '$2==mp{opts=$4} END{print opts}' /proc/mounts
    }

    # "ro" with no emergency_ro = intentional; emergency_ro = forced by kernel after abort
    mount_is_intentionally_readonly() {
      mount_path="$1"
      opts=",$(mount_options_for "$mount_path"),"
      case "$opts" in
        *,emergency_ro,*) return 1 ;;
        *,ro,*) return 0 ;;
        *) return 1 ;;
      esac
    }

    mount_is_active() {
      timeout "$PROBE_TIMEOUT_SECONDS" mountpoint -q "$1"
    }

    probe_mount() {
      mount_path="$1"
      err_file="$2"

      rm -f "$err_file"
      if [ ! -d "$mount_path" ]; then
        return 0
      fi

      # shellcheck disable=SC2016
      if timeout "$PROBE_TIMEOUT_SECONDS" sh -c '
        cd "$1" &&
        ls -A . >/dev/null &&
        probe_dir=".iscsi-eio-probe.$$" &&
        mkdir "$probe_dir" &&
        rmdir "$probe_dir"
      ' sh "$mount_path" 2>"$err_file"; then
        return 0
      fi

      rm -rf "${mount_path}/.iscsi-eio-probe."* 2>/dev/null || true

      if grep -qi 'input/output error' "$err_file" || \
        grep -qi 'I/O error' "$err_file" || \
        grep -qi 'stale file handle' "$err_file"; then
        return 2
      fi
      if grep -qi 'read-only file system' "$err_file"; then
        if mount_is_intentionally_readonly "$mount_path"; then
          return 0
        fi
        return 2
      fi

      return 1
    }

    emit_pod_event() {
      namespace="$1"
      pod_name="$2"
      pod_uid="$3"
      volume_name="$4"
      message="iSCSI CSI mount ${volume_name} returned EIO on node ${NODE_NAME}; tainting node and deleting pod to force remount elsewhere"

      kubectl_timed -n "$namespace" create -f - >/dev/null <<EOF
    apiVersion: events.k8s.io/v1
    kind: Event
    metadata:
      generateName: iscsi-eio-
      namespace: ${namespace}
    regarding:
      apiVersion: v1
      kind: Pod
      name: ${pod_name}
      uid: ${pod_uid}
    reason: IscsiMountEIO
    note: ${message}
    type: Warning
    action: DeletePod
    reportingController: iscsi-eio-remediator
    reportingInstance: ${NODE_NAME}
    eventTime: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    EOF
    }

    remediate_mount() {
      mount_path="$1"
      pod_uid="$(printf '%s\n' "$mount_path" | sed -n 's#^.*/pods/\([^/]*\)/volumes/kubernetes.io~csi/.*#\1#p')"
      volume_name="$(printf '%s\n' "$mount_path" | sed -n 's#^.*/volumes/kubernetes.io~csi/\([^/]*\)/mount$#\1#p')"

      if [ -z "$pod_uid" ] || [ -z "$volume_name" ]; then
        log "could not parse pod UID or volume from ${mount_path}"
        return
      fi

      query_err="/state/pod-query.err"
      if ! info="$(pod_info_for_uid "$pod_uid" 2>"$query_err")"; then
        log "could not query pod ${pod_uid} on ${NODE_NAME}; leaving node quarantined: $(cat "$query_err" 2>/dev/null || true)"
        return
      fi
      if [ -z "$info" ]; then
        log "mounted iSCSI volume ${volume_name} belongs to deleted pod ${pod_uid}; leaving node quarantined for manual CSI cleanup"
        return
      fi

      IFS="$(printf '\t')" read -r namespace pod_name enabled <<EOF
    ${info}
    EOF

      if [ "$enabled" = "false" ]; then
        log "pod ${namespace}/${pod_name} has unhealthy iSCSI mount ${volume_name}, but ${ENABLE_ANNOTATION}=false is set"
        return
      fi

      if [ "$enabled" != "true" ] && [ "$REMEDIATE_UNANNOTATED" != "true" ]; then
        log "pod ${namespace}/${pod_name} has unhealthy iSCSI mount ${volume_name}, but ${ENABLE_ANNOTATION}=true is not set"
        return
      fi

      cooldown_key="$(printf '%s\n' "$pod_uid" | tr -c 'A-Za-z0-9_.-' '_')"
      if recently_deleted "$cooldown_key"; then
        log "recently deleted ${namespace}/${pod_name}; cooldown active"
        return
      fi

      quarantine_node

      log "deleting pod ${namespace}/${pod_name}: iSCSI mount ${volume_name} returned EIO"
      if ! emit_pod_event "$namespace" "$pod_name" "$pod_uid" "$volume_name"; then
        log "failed to emit IscsiMountEIO event for ${namespace}/${pod_name}"
      fi
      if kubectl_timed -n "$namespace" delete pod "$pod_name" --wait=false; then
        remember_delete "$cooldown_key"
      else
        log "failed to delete pod ${namespace}/${pod_name}"
      fi
    }

    mkdir -p "$DELETE_STATE_DIR"
    log "starting iSCSI EIO remediator on ${NODE_NAME} for driver ${CSI_DRIVER_NAME}"
    while [ "$TERMINATING" -eq 0 ]; do
      heartbeat
      prune_delete_state
      scan_file="/state/csi-paths"
      eio_seen=0
      find "$KUBELET_ROOT/pods" -path '*/volumes/kubernetes.io~csi/*' ! -path '*/volumes/kubernetes.io~csi/*/*' >"$scan_file" 2>/dev/null || true

      while IFS= read -r csi_path; do
        [ "$TERMINATING" -eq 0 ] || break
        heartbeat

        case "$csi_path" in
          */volumes/kubernetes.io~csi/*/mount)
            mount_path="$csi_path"
            ;;
          */volumes/kubernetes.io~csi/*)
            mount_path="${csi_path}/mount"
            ;;
          *)
            continue
            ;;
        esac

        driver_name="$(driver_name_for_mount "$mount_path" 2>/dev/null || true)"
        [ "$driver_name" = "$CSI_DRIVER_NAME" ] || continue

        if mount_is_active "$mount_path"; then
          mount_status=0
        else
          mount_status=$?
        fi
        if [ "$mount_status" -eq 1 ]; then
          continue
        fi
        if [ "$mount_status" -ne 0 ]; then
          eio_seen=1
          record_eio
          log "could not determine whether iSCSI mount ${mount_path} is active; leaving node quarantined"
          continue
        fi

        err_file="/state/probe.err"
        set +e
        probe_mount "$mount_path" "$err_file"
        rc="$?"
        set -e
        if [ "$rc" -eq 0 ]; then
          continue
        fi

        if [ "$rc" -eq 2 ]; then
          eio_seen=1
          record_eio
          remediate_mount "$mount_path"
        else
          log "probe failed for ${mount_path}: $(cat "$err_file" 2>/dev/null || true)"
        fi
      done < "$scan_file"

      if [ "$eio_seen" -eq 0 ]; then
        clear_recovered_node
      fi

      heartbeat
      [ "$TERMINATING" -eq 0 ] || break
      interruptible_sleep
    done

    log "stopped iSCSI EIO remediator on ${NODE_NAME}"
