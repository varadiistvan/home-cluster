apiVersion: apps/v1
kind: Deployment
metadata:
  name: iscsi-csi-controller
  namespace: storage
  labels:
    app.kubernetes.io/name: iscsi-csi
    app.kubernetes.io/instance: iscsi-provisioner
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iscsi-csi
      app.kubernetes.io/instance: iscsi-provisioner
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iscsi-csi
        app.kubernetes.io/instance: iscsi-provisioner
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: csi-iscsi-custom-controller-sa
      imagePullSecrets:
        - name: registry-pass
      containers:
        - name: iscsi-custom-provisioner
          # renovate: datasource=docker depName=harbor.stevevaradi.me/stevevaradi/csi-iscsi-provisioner
          image: harbor.stevevaradi.me/stevevaradi/csi-iscsi-provisioner:0.7.1
          imagePullPolicy: IfNotPresent
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/csi.sock
            - name: API_SERVER_URL
              value: "http://192.168.0.151:51084"
            - name: API_TOKEN_PATH
              value: "/etc/csi-secret/token"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi
            - name: secret-storage
              mountPath: "/etc/csi-secret"
              readOnly: true
        - name: csi-provisioner
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          imagePullPolicy: IfNotPresent
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--feature-gates=Topology=true"
            - "--extra-create-metadata=true"
          env:
            - name: ADDRESS
              value: /var/lib/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi
        - name: csi-attacher
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.5.0
          imagePullPolicy: IfNotPresent
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /var/lib/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi
        - name: csi-resizer
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
          imagePullPolicy: IfNotPresent
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /var/lib/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: secret-storage
          secret:
            secretName: iscsi-provisioner-token
