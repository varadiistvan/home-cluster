apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iscsi-csi-node
  namespace: storage
  labels:
    app.kubernetes.io/name: iscsi-csi
    app.kubernetes.io/instance: iscsi-provisioner
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iscsi-csi
      app.kubernetes.io/instance: iscsi-provisioner
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iscsi-csi
        app.kubernetes.io/instance: iscsi-provisioner
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: csi-iscsi-custom-node-sa
      tolerations:
        - key: iscsi.stevevaradi.me/eio
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: registry-pass
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: liveness-probe
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --health-port=29753
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: node-driver-registrar
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          args:
            - "--v=5"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/iscsi.stevevaradi.me/csi.sock"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: iscsi-plugin
          # renovate: datasource=docker depName=harbor.stevevaradi.me/stevevaradi/csi-driver-iscsi
          image: harbor.stevevaradi.me/stevevaradi/csi-driver-iscsi:v2.14.0
          imagePullPolicy: Always
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--nodeid=$(NODE_ID)"
            - "--v=5"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: ISCSI_STATE_DIR
              value: /var/lib/iscsi-csi
            - name: ISCSIADM_TIMEOUT_SEC
              value: "60"
          ports:
            - containerPort: 29753
              name: healthz
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
            - name: host-root
              mountPath: /host
              mountPropagation: "HostToContainer"
            - name: chroot-iscsiadm
              mountPath: /sbin/iscsiadm
              subPath: iscsiadm
            - name: iscsi-state
              mountPath: /var/lib/iscsi-csi
            - name: run-udev
              mountPath: /run/udev
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/iscsi.stevevaradi.me
            type: DirectoryOrCreate
        - name: iscsi-state
          hostPath:
            path: /var/lib/iscsi-csi
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: run-udev
          hostPath:
            path: /run/udev
            type: Directory
        - name: chroot-iscsiadm
          configMap:
            defaultMode: 0755
            name: iscsi-csi-iscsiadm
