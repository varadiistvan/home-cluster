---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iscsi-provisioner
  namespace: storage
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-iscsi-provisioner-chart
      # renovate: datasource=docker depName=harbor.stevevaradi.me/stevevaradi/csi-iscsi-provisioner-chart
      version: 0.11.1
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: iscsi-provisioner-values
