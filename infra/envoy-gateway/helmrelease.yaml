---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  timeout: 10m
  install:
    crds: Create
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: gateway-helm
      # renovate: datasource=docker depName=envoyproxy/gateway-helm versioning=semver
      version: v1.8.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
