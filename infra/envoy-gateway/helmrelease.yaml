---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  timeout: 10m
  install:
    crds: Create
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Gateway API and Envoy Gateway CRDs are managed outside this chart.
    # The bundled chart CRDs use the experimental Gateway API channel.
    crds:
      enabled: false
  chart:
    spec:
      chart: gateway-helm
      # renovate: datasource=docker depName=envoyproxy/gateway-helm versioning=semver
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
