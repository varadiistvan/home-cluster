---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: storage
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: community-operator
      # renovate: datasource=helm depName=community-operator registryUrl=https://mongodb.github.io/helm-charts
      version: 0.13.0
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: mongodb-community-operator-values
