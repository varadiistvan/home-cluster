---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: system
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: metrics-server
      # renovate: datasource=helm depName=metrics-server registryUrl=https://kubernetes-sigs.github.io/metrics-server/
      version: 3.14.x
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: metrics-server-values
