---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: storage
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-nfs
      # renovate: datasource=helm depName=csi-driver-nfs registryUrl=https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      version: 4.13.3
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: nfs-provisioner-values
