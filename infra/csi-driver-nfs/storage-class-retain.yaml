---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-retain
provisioner: nfs.csi.k8s.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
parameters:
  mountPermissions: "777"
  server: 192.168.0.151
  share: /pvcs
  subDir: /${pv.metadata.name}
