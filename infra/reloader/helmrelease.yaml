---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: system
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      # renovate: datasource=helm depName=reloader registryUrl=https://stakater.github.io/stakater-charts
      version: 2.2.x
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: reloader-values
