apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
data:
  settings.yaml: |
    title: Home Cluster
    description: Services running on the home cluster
    startUrl: https://homepage.stevevaradi.me
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank
    layout:
      Media:
        style: row
        columns: 4
      Files & Documents:
        style: row
        columns: 4
      Tools:
        style: row
        columns: 4
      Home:
        style: row
        columns: 4
      3D Printing:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4

  # Services are discovered from HTTPRoute/Ingress gethomepage.dev/* annotations.
  services.yaml: |
    []

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23

  kubernetes.yaml: |
    mode: cluster
    ingress: true
    gateway: true
    traefik: false

  bookmarks.yaml: |
    - Cluster:
        - Repo:
            - abbr: GH
              href: https://github.com/varadiistvan/home-cluster

