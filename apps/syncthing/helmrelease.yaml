---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: syncthing
      # renovate: datasource=helm depName=syncthing registryUrl=oci://harbor.stevevaradi.me/stevevaradi
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: syncthing-values
