image:
  repository: docker.io/syncthing/syncthing
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: registry-pass
persistence:
  enabled: false
  size: 50Gi
  storageClass: iscsi-csi
  accessModes:
  - ReadWriteOnce
service:
  tcp:
    enabled: true
    type: LoadBalancer
    port: 22000
    annotations: {}
    externalTrafficPolicy: Cluster
  udp:
    enabled: true
    type: LoadBalancer
    port: 22000
    annotations: {}
    externalTrafficPolicy: Cluster
  discovery:
    enabled: true
    type: LoadBalancer
    port: 21027
    annotations: {}
    externalTrafficPolicy: Local
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/24,10.192.1.0/24
  hosts:
  - host: syncthing.stevevaradi.me
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: syncthing-tls
    hosts:
    - syncthing.stevevaradi.me
syncthing:
  timezone: Europe/Amsterdam
  config:
    gui:
      address: 0.0.0.0:8384
      tls: false
    options:
      globalAnnounceEnabled: false
      localAnnounceEnabled: true
      listenAddresses:
      - tcp://0.0.0.0:22000
      - quic://0.0.0.0:22000
      alwaysLocalNets: []
      stunKeepaliveStartS: 0
