---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: searxng
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "SearXNG"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "mdi-magnify"
    gethomepage.dev/description: "Metasearch engine"
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-searxng
  hostnames:
    - searxng.stevevaradi.me
  rules:
    - backendRefs:
        - name: searxng
          port: 8080
