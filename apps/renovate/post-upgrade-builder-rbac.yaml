apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-post-upgrade-builder
  namespace: automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-post-upgrade-builder
  namespace: automation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-post-upgrade-builder
  namespace: automation
subjects:
  - kind: ServiceAccount
    name: renovate-post-upgrade-builder
    namespace: automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renovate-post-upgrade-builder
