image:
  registry: ghcr.io
  useFull: false
imagePullSecrets:
  - name: registry-pass
cronjob:
  schedule: 0 */1 * * *
  timeZone: Europe/Amsterdam
  suspend: false
  concurrencyPolicy: Forbid
  parallelism: 1
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 2
  jobRestartPolicy: Never
existingSecret: renovate-env
envFrom: []
env:
  LOG_LEVEL: debug
renovate:
  persistence:
    cache:
      enabled: false
  configIsSecret: false
  configIsJson5: true
  config: |
    {
      "platform": "github",

      // "autodiscover": true,
      // "autodiscoverFilter": ["varadiistvan/*"],

      "autodiscover": false,
      "repositories": [
        "varadiistvan/home-cluster",
        "varadiistvan/paytowin-kb",
        "varadiistvan/voorraadhokmap",
        "varadiistvan/rofi-alarm"
      ],

      "onboarding": true,

      "prConcurrentLimit": 20,

      "binarySource": "install",

      "enabledManagers": ["flux", "dockerfile", "docker-compose", "kubernetes", "helm-values", "helmv3", "terraform", "gomod", "cargo", "github-actions", "npm", "gradle", "gradle-wrapper", "custom.regex"],

      "allowedCommands": ["^python3 -c .*"],

      "npm": {
        "postUpdateOptions": ["npmDedupe"],
        "ignoreScripts": true
      },

      "packageRules": [
        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^harbor\\.stevevaradi\\.me\\/ghcr\\//"],
          "registryUrls": ["https://ghcr.io"]
          // (optional) set hostRules for ghcr.io if private
        },

        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^harbor\\.stevevaradi\\.me\\/quay\\//"],
          "registryUrls": ["https://quay.io"]
        },

        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^harbor\\.stevevaradi\\.me\\/k8s-reg\\//"],
          "registryUrls": ["https://registry.k8s.io"]
        },

        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^harbor\\.stevevaradi\\.me\\/hub\\/[^/]+\\//"],
          "registryUrls": ["https://index.docker.io"]
        },

        {
          "matchDatasources": ["docker"],
          "matchPackageNames": ["/^harbor\\.stevevaradi\\.me\\/hub\\/library\\//"],
          "registryUrls": ["https://index.docker.io"]
        },

        {
          "matchManagers": ["flux"],
          "matchDatasources": ["helm"],
          "matchPackageNames": ["pi5-monitor"],
          "enabled": false
        }
      ],

      "extends": ["config:recommended", ":dependencyDashboard"],
      "timezone": "Europe/Amsterdam"
    }
