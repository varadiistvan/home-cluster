---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: automation
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: renovate
      # renovate: datasource=docker depName=ghcr.io/renovatebot/charts/renovate
      version: 46.x.x
      sourceRef:
        kind: HelmRepository
        name: ghcr-renovatebot
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: renovate-values
