replicaCount: 1
strategy:
  type: RollingUpdate
image:
  registry: docker.io
  repository: stirlingtools/stirling-pdf
rootPath: null
envs:
  - name: _JAVA_OPTIONS
    value: "-Djava.io.tmpdir=/tmp/stirling-pdf"
envsFrom: []
serviceAccount:
  create: true
securityContext:
  enabled: false
  fsGroup: 1000
containerSecurityContext: {}
priorityClassName: ''
nodeSelector: {}
tolerations: []
affinity: {}
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 8Gi
  labels: {}
  path: /tmp
  storageClass: nfs-csi-retain
ingress:
  enabled: true
  pathType: ImplementationSpecific
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.1/24, 10.192.1.1/24
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
  - name: stirling-pdf.stevevaradi.me
    path: /
    tls: true
    tlsSecret: stirling-pdf.stevevaradi.me-tls
deployment:
  extraVolumes:
  - name: stirling-pdf-config
    configMap:
      name: stirling-pdf-config
      items:
      - key: custom_settings.yml
        path: custom_settings.yml
  - name: stirling-temp
    emptyDir: {}
  extraVolumeMounts:
  - name: stirling-pdf-config
    mountPath: /configs/custom_settings.yml
    subPath: custom_settings.yml
    readOnly: true
  - name: stirling-temp
    mountPath: /tmp/stirling-pdf
