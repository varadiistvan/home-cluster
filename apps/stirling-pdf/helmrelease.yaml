---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: stirling-pdf-chart
      # renovate: datasource=helm depName=stirling-pdf-chart registryUrl=https://docs.stirlingpdf.com/Stirling-PDF-chart
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: stirling-pdf-values
