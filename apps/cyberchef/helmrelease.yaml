---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cyberchef
  namespace: cyberchef
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cyberchef
      version: 1.3.4
      sourceRef:
        kind: HelmRepository
        name: obeone
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: cyberchef-values
