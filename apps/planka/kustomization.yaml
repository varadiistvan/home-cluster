apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./security-policy.yaml
  - ./planka-admin-secret.enc.yaml
  - ./planka-appkey-secret.enc.yaml
  - ./planka-dburi-secret.enc.yaml
  - ./planka-password-secret.enc.yaml
configMapGenerator:
- name: planka-values
  namespace: planka
  files:
  - values.yaml=planka-values.yaml
configurations:
- ../../common/kustomizeconfig.yaml
