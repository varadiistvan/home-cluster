---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: planka
  namespace: planka
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: planka
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: planka
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: planka-values
