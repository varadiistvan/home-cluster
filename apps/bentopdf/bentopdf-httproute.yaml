---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  namespace: bentopdf
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "BentoPDF"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "mdi-file-pdf-box"
    gethomepage.dev/description: "PDF toolkit"
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-bentopdf
  hostnames:
    - bentopdf.stevevaradi.me
  rules:
    - backendRefs:
        - name: bentopdf
          port: 80
