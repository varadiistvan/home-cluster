---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-data
  namespace: storage
  labels:
    app.kubernetes.io/name: overleaf
    app.kubernetes.io/instance: overleaf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi-csi
  resources:
    requests:
      storage: 50Gi
