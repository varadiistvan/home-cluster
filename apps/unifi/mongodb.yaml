apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: unifi-mongodb
  namespace: home
spec:
  members: 1
  type: ReplicaSet
  featureCompatibilityVersion: "7.0"
  # renovate: datasource=docker depName=mongo versioning=semver
  version: "7.0.43"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: unifi
      db: admin
      passwordSecretRef:
        name: unifi-mongodb
      roles:
        - name: dbOwner
          db: ace
        - name: dbOwner
          db: ace_stat
        - name: dbOwner
          db: ace_audit
        - name: dbOwner
          db: ace_restore
        - name: clusterMonitor
          db: admin
      scramCredentialsSecretName: unifi-scram
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: iscsi-csi
            resources:
              requests:
                storage: 10Gi
        - metadata:
            name: logs-volume
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: iscsi-csi
            resources:
              requests:
                storage: 2Gi
      template:
        spec:
          containers:
            - name: mongodb-agent
              readinessProbe:
                timeoutSeconds: 5
              resources:
                requests:
                  cpu: 15m
                  memory: 112Mi
                limits:
                  memory: 256Mi
            - name: mongod
              resources:
                requests:
                  cpu: 10m
                  memory: 320Mi
                limits:
                  memory: 1Gi
