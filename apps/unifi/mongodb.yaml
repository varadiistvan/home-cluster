---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: unifi-mongodb
  namespace: home
spec:
  members: 1
  type: ReplicaSet
  featureCompatibilityVersion: "7.0"
  # renovate: datasource=docker depName=mongo versioning=semver
  version: "7.0.43"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: unifi
      db: admin
      passwordSecretRef:
        name: unifi-mongodb
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: unifi-scram
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongodb-agent
              # default 1s readiness timeout flaps on slow nodes
              readinessProbe:
                timeoutSeconds: 5
