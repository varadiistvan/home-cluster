---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: home
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: unifi
      # renovate: datasource=docker depName=ghcr.io/mkilchhofer/unifi-chart/unifi
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: ghcr-mkilchhofer
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: unifi-values
