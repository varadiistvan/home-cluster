replicaCount: 1
image:
  repository: docker.io/copyparty/ac
  pullPolicy: IfNotPresent
  tag: 1.19.20
imagePullSecrets:
- name: registry-pass
serviceAccount:
  create: true
  automount: true
service:
  type: ClusterIP
  http: 3923
  smb: 945
  ftp: 21
  tftp: 69
  ftps: 990
  pftp:
  - 12000
  - 12099
  ssdp: 1900
  mdns: 5353
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/24,10.192.1.0/24
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
  - host: copyparty.stevevaradi.me
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - secretName: copyparty-tls
    hosts:
    - copyparty.stevevaradi.me
resources: {}
volumes: []
volumeMounts: []
storage:
  storageClass: iscsi-csi
  size: 480Gi
  accessModes:
  - ReadWriteOnce
existingConfigMap: copyparty-config
