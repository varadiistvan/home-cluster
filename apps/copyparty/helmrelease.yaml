---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: copyparty
  namespace: copyparty
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: copyparty
      # renovate: datasource=docker depName=ghcr.io/danielr1996/copyparty
      version: 0.5.1
      sourceRef:
        kind: HelmRepository
        name: ghcr-danielr1996
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: copyparty-values
