---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wiki
  namespace: scratch
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: endless-wiki
      # renovate: datasource=helm depName=endless-wiki registryUrl=oci://harbor.stevevaradi.me/stevevaradi
      version: 0.1.6
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: wiki-values
