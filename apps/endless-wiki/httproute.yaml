---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wiki
  namespace: scratch
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Endless Wiki"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "mdi-book-open-variant"
    gethomepage.dev/description: "Generated wiki"
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-wiki
  hostnames:
    - wiki.stevevaradi.me
  rules:
    - backendRefs:
        - name: wiki
          port: 8080
