---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: home-assistant
      # renovate: datasource=helm depName=home-assistant registryUrl=https://pajikos.github.io/home-assistant-helm-chart/
      version: 0.3.66
      sourceRef:
        kind: HelmRepository
        name: pajikos
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: home-assistant-values
