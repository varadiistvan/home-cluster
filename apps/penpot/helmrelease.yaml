---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot
  namespace: penpot
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: penpot
      # renovate: datasource=helm depName=penpot registryUrl=https://helm.penpot.app
      version: 1.7.x
      sourceRef:
        kind: HelmRepository
        name: penpot
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: penpot-values
  - kind: Secret
    name: postgres-penpot
    valuesKey: password
    targetPath: config.postgresql.password
