apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./security-policy.yaml
  - ./penpot-api-key-secret.enc.yaml
  - ./penpot-redis-uri-secret.enc.yaml
  - ./postgres-penpot-secret.enc.yaml
configMapGenerator:
- name: penpot-values
  namespace: penpot
  files:
  - values.yaml=penpot-values.yaml
configurations:
- ../../common/kustomizeconfig.yaml
