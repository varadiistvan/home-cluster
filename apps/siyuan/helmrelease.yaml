---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: siyuan
  namespace: siyuan
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: siyuan
      # renovate: datasource=helm depName=siyuan registryUrl=https://ex-trim.github.io/helm-charts
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: ex-trim
        namespace: flux-system
  # Chart 0.1.1 hardcodes the pre-3.8 kernel arguments. Newer images require
  # the `serve` subcommand; keep this post-render patch until the chart exposes args.
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: siyuan
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args
            value:
            - serve
            - --workspace=/siyuan/workspace
  valuesFrom:
  - kind: ConfigMap
    name: siyuan-values
