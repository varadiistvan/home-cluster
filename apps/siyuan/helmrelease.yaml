---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: siyuan
  namespace: siyuan
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: siyuan
      # renovate: datasource=helm depName=siyuan registryUrl=https://ex-trim.github.io/helm-charts
      version: 0.1.x
      sourceRef:
        kind: HelmRepository
        name: ex-trim
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: siyuan-values
