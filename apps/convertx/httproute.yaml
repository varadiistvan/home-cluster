---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: convertx
  namespace: convertx
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ConvertX"
    gethomepage.dev/group: "Tools"
    gethomepage.dev/icon: "mdi-file-swap"
    gethomepage.dev/description: "File conversion"
spec:
  parentRefs:
    - name: cilium-gateway-local
      namespace: network
      sectionName: https-convertx
  hostnames:
    - convertx.stevevaradi.me
  rules:
    - backendRefs:
        - name: convertx
          port: 3000
