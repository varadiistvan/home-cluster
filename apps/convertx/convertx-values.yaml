convertx:
  jwt:
    existingSecret:
      enabled: true
      name: convertx-jwt
  env:
    ACCOUNT_REGISTRATION: 'false'
    ALLOW_UNAUTHENTICATED: 'true'
    AUTO_DELETE_EVERY_N_HOURS: '24'
    FFMPEG_ARGS: ''
    HIDE_HISTORY: 'false'
    HTTP_ALLOWED: 'false'
    LANGUAGE: en
    WEBROOT: null
  repository:
    image: ghcr.io/c4illin/convertx
    tag: main
  persistence:
    data:
      storageClass: iscsi-csi
      size: 15Gi
      accessMode:
      - ReadWriteOnce
      enabled: true
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 5g
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.1/24, 10.192.1.1/24
    host: convertx.stevevaradi.me
    path: /
    enabled: false
    tls:
      enabled: true
  nodeSelector: {}
  resources: {}
  imagePullPolicy: IfNotPresent
  serviceAccount: ''
pullSecrets: []
