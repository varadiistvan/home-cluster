global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true
diagnosticMode:
  enabled: false
image:
  repository: bitnamilegacy/redis
architecture: standalone
auth:
  enabled: true
  sentinel: true
  existingSecret: renovate-redis-auth
  existingSecretPasswordKey: password
master:
  resourcesPreset: none
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: nfs-csi
    accessModes:
    - ReadWriteOnce
    size: 8Gi
metrics:
  enabled: true
  image:
    repository: bitnamilegacy/redis-exporter
  prometheusRule:
    enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  resourcesPreset: none
volumePermissions:
  enabled: true
  image:
    repository: bitnamilegacy/os-shell
kubectl.image.repository: bitnamilegacy/kubectl
