---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-redis
  namespace: media
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: redis
      # renovate: datasource=docker depName=registry-1.docker.io/bitnamicharts/redis versioning=semver
      version: 22.0.x
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: immich-redis-values
