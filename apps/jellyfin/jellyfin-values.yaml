image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.11.11"
podAnnotations:
  iscsi.stevevaradi.me/eio-remediate: "true"
deploymentStrategy:
  type: Recreate
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - macm1
ingress:
  enabled: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
  - host: jellyfin.stevevaradi.me
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: jellyfin-tls
    hosts:
    - jellyfin.stevevaradi.me
volumes:
- name: nfs-media
  nfs:
    server: 192.168.0.151
    path: /export/media
volumeMounts:
- name: nfs-media
  mountPath: /nfs_media
persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 25Gi
    storageClass: iscsi-csi
  media:
    enabled: false
securityContext:
  privileged: true
