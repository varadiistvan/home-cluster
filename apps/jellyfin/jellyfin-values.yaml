image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.11.11"
# Keep liveness and readiness probes disabled until Jellyfin reports healthy.
# This prevents kubelet from restarting the pod during long database migrations.
startupProbe:
  tcpSocket: null
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 8640
# Mark transient stalls unready quickly, but only restart Jellyfin after three
# minutes of continuous health-check failures.
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
podAnnotations:
  iscsi.stevevaradi.me/eio-remediate: "true"
deploymentStrategy:
  type: Recreate
  # Remove the RollingUpdate settings owned by the previous chart revision.
  rollingUpdate: null
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - macm1
ingress:
  enabled: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
  - host: jellyfin.stevevaradi.me
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: jellyfin-tls
    hosts:
    - jellyfin.stevevaradi.me
volumes:
- name: nfs-media
  nfs:
    server: 192.168.0.151
    path: /export/media
volumeMounts:
- name: nfs-media
  mountPath: /nfs_media
persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 25Gi
    storageClass: iscsi-csi
  media:
    enabled: false
securityContext:
  privileged: true
