image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.11.11"
# The 24-hour startup window prevents long database migrations from being killed.
startupProbe:
  tcpSocket: null
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 8640
# Keep degraded instances out of service without restarting them. Readiness
# checks the health response body because Jellyfin always returns HTTP 200.
readinessProbe:
  httpGet: null
  exec:
    command:
      - /bin/sh
      - -ec
      - test "$(curl -fsS --max-time 4 http://127.0.0.1:8096/health)" = Healthy
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Liveness is TCP-only and is suppressed until startup has succeeded.
livenessProbe:
  httpGet: null
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
podAnnotations:
  iscsi.stevevaradi.me/eio-remediate: "true"
deploymentStrategy:
  type: Recreate
  rollingUpdate: null
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - macm1
ingress:
  enabled: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: jellyfin.stevevaradi.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: jellyfin-tls
      hosts:
        - jellyfin.stevevaradi.me
volumes:
  - name: nfs-media
    nfs:
      server: 192.168.0.151
      path: /export/media
volumeMounts:
  - name: nfs-media
    mountPath: /nfs_media
persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 25Gi
    storageClass: iscsi-csi
  media:
    enabled: false
securityContext:
  privileged: true
