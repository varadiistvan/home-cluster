image:
  registry: ghcr.io
  repository: fallenbagel/jellyseerr
  pullPolicy: IfNotPresent
imagePullSecrets:
- name: registry-pass
strategy:
  type: Recreate
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''
service:
  type: ClusterIP
  port: 80
config:
  persistence:
    size: 15Gi
    annotations: {}
    accessModes:
    - ReadWriteOnce
    storageClass: iscsi-csi
ingress:
  enabled: false
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.1/24, 10.192.1.1/24
  hosts:
  - host: jellyseer.stevevaradi.me
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - secretName: jellyseer-tls
    hosts:
    - jellyseer.stevevaradi.me
resources: {}
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
