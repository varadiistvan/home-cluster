---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseer
  namespace: media
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: seerr-chart
      # renovate: datasource=docker depName=ghcr.io/seerr-team/seerr/seerr-chart
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: ghcr-seerr-team
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: jellyseer-values
