---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 30m
  # Jellyfin database migrations can take hours and must not be interrupted.
  timeout: 24h
  install:
    remediation:
      retries: -1
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 30m
  chart:
    spec:
      chart: jellyfin
      # renovate: datasource=helm depName=jellyfin registryUrl=https://jellyfin.github.io/jellyfin-helm
      version: 3.2.x
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: jellyfin-values
