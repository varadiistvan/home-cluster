server:
  image:
    repository: ghcr.io/gabe565/obico/web
    tag: sha-e3993e83d5a7f07617275c3e71b011c5ca59fa4d
  podAnnotations:
    iscsi.stevevaradi.me/eio-remediate: "true"
  env:
    EMAIL_HOST: smtp.gmail.com
    EMAIL_PORT: '587'
    EMAIL_USE_TLS: 'True'
    EMAIL_HOST_USER: varadiista.1
    DEFAULT_FROM_EMAIL: varadiista.1@gmail.com
    SITE_IS_PUBLIC: 'True'
    ACCOUNT_ALLOW_SIGN_UP: 'True'
    SITE_FULL_URL: 'https://obico.stevevaradi.me'
  persistence:
    data:
      enabled: true
      storageClass: iscsi-csi
      accessMode: ReadWriteOnce
      size: 10Gi
    media:
      enabled: true
      storageClass: iscsi-csi
      accessMode: ReadWriteOnce
      size: 10Gi
  ingress:
    main:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/24,10.192.1.0/24
        nginx.ingress.kubernetes.io/proxy-body-size: '0'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
        nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
      hosts:
      - host: obico.stevevaradi.me
        paths:
        - path: /
      tls:
      - secretName: obico-tls
        hosts:
        - obico.stevevaradi.me
ml-api:
  image:
    repository: ghcr.io/gabe565/obico/ml-api
