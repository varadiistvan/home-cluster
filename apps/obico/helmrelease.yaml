---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obico
  namespace: home
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: obico
      version: 0.6.0
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: obico-values
  - kind: Secret
    name: obico-smtp
    valuesKey: EMAIL_HOST_PASSWORD
    targetPath: EMAIL_HOST_PASSWORD
