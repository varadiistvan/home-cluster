apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app.kubernetes.io/name: navidrome
    app.kubernetes.io/instance: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
      app.kubernetes.io/instance: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/instance: navidrome
      annotations:
        iscsi.stevevaradi.me/eio-remediate: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-music-directory
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /nfs_media/music
              chmod 0775 /nfs_media/music
          volumeMounts:
            - name: media
              mountPath: /nfs_media
      containers:
        - name: navidrome
          # renovate: datasource=docker depName=deluan/navidrome
          image: docker.io/deluan/navidrome:0.63.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ND_MUSICFOLDER
              value: /nfs_media/music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_SCANNER_SCHEDULE
              value: "@every 1h"
            - name: ND_ENABLEDOWNLOADS
              value: "true"
            - name: ND_LOGLEVEL
              value: info
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 4533
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media
              mountPath: /nfs_media
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: media
          nfs:
            server: 192.168.0.151
            path: /export/media
